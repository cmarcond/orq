<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HighLevel</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topo">
  <div class="marca">HighLevel</div>
  <div id="resumo-run" class="resumo"></div>
  <div class="acoes">
    <label class="toggle"><input type="checkbox" id="ver-bastidores"> backstage</label>
    <label class="toggle"><input type="checkbox" id="ver-thinking"> thinking</label>
    <button id="btn-runs" class="btn">runs</button>
    <button id="btn-parar" class="btn btn-perigo" hidden>stop</button>
    <button id="btn-novo" class="btn" hidden>new run</button>
  </div>
</header>

<div id="painel-runs" class="painel" hidden>
  <div class="painel-h">previous runs</div>
  <div id="lista-runs"></div>
</div>

<main id="tela-nova" class="nova">
  <form id="form-run" class="cartao-form">
    <h1>A new pipeline</h1>
    <p class="ajuda">Two Claude Codes in the same directory: the top one translates and delegates,
      the bottom one works and reports milestones.</p>
    <label>Working directory
      <input name="cwd" required placeholder="/private/tmp/hl-demo" value="/private/tmp/hl-demo">
    </label>
    <label>Task
      <textarea name="task" required rows="4" placeholder="Create a hello.py that…">Create a hello.py that takes a name as an argument and prints 'Hello, <name>!', with at least 3 automated tests, and run the tests at the end.</textarea>
    </label>
    <label>Pipeline
      <select name="pipeline" id="sel-pipeline"></select>
      <small class="ajuda" id="desc-pipeline"></small>
    </label>
    <label>Permission mode
      <select name="permission_mode">
        <option value="auto">auto — resolves the common requests on its own</option>
        <option value="acceptEdits">acceptEdits — accepts edits, asks about the rest</option>
        <option value="manual">manual — asks about everything</option>
        <option value="bypassPermissions">bypassPermissions — asks nothing</option>
      </select>
      <small class="ajuda">Applies to all levels: modes of different classes make
        Claude Code hold the messages between them.</small>
    </label>
    <button class="btn btn-principal" type="submit">start</button>
    <div id="erro-form" class="erro" hidden></div>
  </form>
</main>

<main id="tela-run" class="palco-grid" hidden>
  <aside class="rail">
    <div class="rail-h">levels</div>
    <div id="niveis"></div>
    <div class="rail-h">task</div>
    <div id="tarefa" class="tarefa"></div>
  </aside>

  <section class="palco">
    <div id="palco" class="fluxo"></div>
    <div id="gaveta" class="gaveta" hidden>
      <div class="gaveta-h">
        <span id="gaveta-titulo"></span>
        <button id="gaveta-fechar" class="btn">close</button>
      </div>
      <pre id="gaveta-corpo"></pre>
    </div>

    <form id="form-msg" class="compositor">
      <select id="alvo" title="who the message goes to"></select>
      <input id="msg" placeholder="talk to the professor…" autocomplete="off">
      <button class="btn btn-principal" type="submit">send</button>
    </form>
  </section>

  <aside class="fios">
    <div class="rail-h">wires <span id="conta-fios" class="conta"></span></div>
    <div id="fios" class="fluxo"></div>
  </aside>
</main>

<script src="/app.js"></script>
</body>
</html>
