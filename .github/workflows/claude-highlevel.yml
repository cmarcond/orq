name: claude-highlevel
on:
  push:
    branches: [main]
    paths: ["claude-highlevel/**", ".github/workflows/claude-highlevel.yml"]
  pull_request:
    paths: ["claude-highlevel/**", ".github/workflows/claude-highlevel.yml"]

defaults:
  run:
    working-directory: claude-highlevel

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest && python3 -m pytest -q -m "not slow"
