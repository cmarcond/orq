name: orq-web
on:
  push:
    branches: [main]
    paths: ["orq-web/**", ".github/workflows/orq-web.yml"]
  pull_request:
    paths: ["orq-web/**", ".github/workflows/orq-web.yml"]

defaults:
  run:
    working-directory: orq-web

jobs:
  python:
    # 24.04 fixo: a imagem ubuntu-latest (26.04) não tem Python 3.8 no setup-python
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test 'tests/js/*.test.mjs'

  docker:
    runs-on: ubuntu-latest
    needs: [python, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t orq-web:ci .
      - name: fumaça
        run: |
          mkdir -p /tmp/orq && echo '{"accounts":[],"orq_hosts":[]}' > /tmp/orq/accounts.json && echo senha > /tmp/orq/password
          docker run -d --name orq -p 8765:8765 -e ORQ_ALLOWED_HOSTS=localhost \
            -e CLAUDE_MULTICONTA_CONF=/cfg/accounts.json -e ORQ_PASSWORD_FILE=/cfg/password -e ORQ_STATE_DIR=/tmp \
            -v /tmp/orq:/cfg:ro orq-web:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8765/login >/dev/null && break; sleep 1; done
          curl -fs http://localhost:8765/login | grep -q '<form'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/api/state)" = 403
