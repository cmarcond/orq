# orq-web no server0, só na interface ZeroTier. Rode pelo deploy/server0/deploy.sh, que gera a
# senha e o ssh_config do container. A porta fica publicada apenas no IP do ZeroTier.
services:
  orq-web:
    image: orq-web:local
    build:
      context: ../..
      args: { UID: "${UID:-1000}", GID: "${GID:-1000}", USER: "${USER:-user}" }
    container_name: orq-web
    restart: unless-stopped
    ports:
      - "${ORQ_ZT_IP}:8765:8765"
    environment:
      ORQ_ALLOWED_HOSTS: "${ORQ_ZT_IP},${ORQ_HOSTNAME}"
      ORQ_EXTRA_HOSTS: "laptop"          # o laptop entra como host por ssh pelo ZeroTier
      ORQ_USAGE_HOST: "${ORQ_HOSTNAME}"  # a cota é lida por ssh numa máquina com credenciais
    volumes:
      - "${HOME}/.ssh:${HOME}/.ssh:ro"
      - "${HOME}/.config/claude-multiconta:${HOME}/.config/claude-multiconta:ro"
      - "${HOME}/.config/orq-web:${HOME}/.config/orq-web"
