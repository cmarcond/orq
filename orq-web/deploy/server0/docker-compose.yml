# orq-web on server0, only on the ZeroTier interface. Run it through deploy/server0/deploy.sh, which
# generates the password and the container's ssh_config. The port is published only on the ZeroTier IP.
services:
  orq-web:
    image: ghcr.io/cmarcond/orq-web:latest   # published by CI; without access to GHCR, the deploy builds locally under this name
    build:
      context: ../..
      args: { UID: "${UID:-1000}", GID: "${GID:-1000}", USER: "${USER:-user}" }
    container_name: orq-web
    restart: unless-stopped
    ports:
      - "${ORQ_ZT_IP}:8765:8765"
    environment:
      ORQ_ALLOWED_HOSTS: "${ORQ_ZT_IP},${ORQ_HOSTNAME}"
      ORQ_EXTRA_HOSTS: "laptop"          # the laptop joins as a host over ssh through ZeroTier
      ORQ_USAGE_HOST: "${ORQ_HOSTNAME}"  # the quota is read over ssh on a machine with credentials
    volumes:
      - "${HOME}/.ssh:${HOME}/.ssh:ro"
      - "${HOME}/.config/claude-multiconta:${HOME}/.config/claude-multiconta:ro"
      - "${HOME}/.config/orq-web:${HOME}/.config/orq-web"
