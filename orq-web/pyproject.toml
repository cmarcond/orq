[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orqweb"
version = "0.1.0"
description = "Chat local com agentes do Claude Code em várias máquinas e contas: supervisor sem terminal (stream-json) e página web."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
orq-agent = "orqweb.agent.cli:main"
orq-web = "orqweb.server.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
qa = ["pytest>=7", "playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["orqweb*"]

[tool.setuptools.package-data]
"orqweb" = ["pipelines/*.toml"]
"orqweb.server" = ["static/*", "static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["UP006", "UP007", "UP035"]   # anotações compatíveis com 3.8
